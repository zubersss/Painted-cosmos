<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Painted Cosmos: Painter's gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #F4EFE4; overflow: hidden; font: 13px/1.4 Georgia, 'Times New Roman', serif; color: #3b3a44; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; left: 14px; top: 12px; background: rgba(244, 239, 228, 0.86); padding: 8px 10px; border-radius: 3px; box-shadow: 0 1px 6px rgba(47, 58, 93, 0.25); max-width: 300px; }
  #ui label { display: block; margin: 3px 0; }
  #ui select, #ui input { font: inherit; color: inherit; background: #fbf8f1; border: 1px solid #b9b3a8; }
  #ui small { color: #6f6b7a; }
  .hidden { display: none; }
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <label>planet <select id="body"></select></label>
  <label>biome <select id="biome"></select></label>
  <label>time <input id="time" type="range" min="0" max="24" step="0.25" value="12"> <span id="timev">12</span>h</label>
  <label>quality <select id="quality"><option value="0">low</option><option value="1" selected>medium</option><option value="2">high</option></select></label>
  <label>view <select id="view"><option value="0">painting</option><option value="1">scene colour</option><option value="2">wetness</option><option value="3">normal + depth</option><option value="4">regions</option><option value="5">abstraction</option></select></label>
  <small id="stat"></small><br>
  <small>drag to look, WASD + QE to fly, shift = fast, G = ground, H = hide panel</small>
</div>
<script type="module" src="./src/art/gallery.js"></script>
</body>
</html>
