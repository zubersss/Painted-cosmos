  L.push(`     wet ${w.wetness01.toFixed(2)}  snow ${(w.snowDepth * 100).toFixed(1)} cm  lightning ${w.lightning.rate.toFixed(1)}/min flash ${w.lightning.flash01.toFixed(2)} next ${Number.isFinite(w.lightning.nextIn) ? w.lightning.nextIn.toFixed(1) + ' s' : '-'} thunder in ${Number.isFinite(w.lightning.thunderIn) ? w.lightning.thunderIn.toFixed(1) + ' s' : '-'}`);
  if (useExplorer && ex.phys) { const B = ex.phys; L.push(`walk ${B.speedGround.toFixed(2)} m/s on ${B.material} (mu ${B.friction.toFixed(2)})  ${ex.grounded ? 'grounded' : 'airborne'}  slip ${B.slip01.toFixed(2)} scramble ${B.scramble01.toFixed(2)}  sink ${(B.sink * 100).toFixed(1)} cm  jet ${B.jetThrottle.toFixed(2)}  wind push ${B.windAccel.toFixed(2)} m/s2`); }
  if (useShip && sh.phys) { const B = sh.phys; L.push(`ship ${shPhase}  alt ${shEnv.altGround.toFixed(2)} m  v ${Math.hypot(sh.v.x, sh.v.y, sh.v.z).toFixed(2)} m/s  lift ${B.lift01.toFixed(2)}  feet ${B.contacts}  legs ${Array.from(B.legCompress).map((x) => (x * 100).toFixed(1)).join('/')} cm  ${B.asleep ? 'asleep' : ''}`); L.push(`     downwash ${(B.downwash.thrust / 1000).toFixed(1)} kN  ${B.downwash.speed.toFixed(1)} m/s  ground effect x${B.groundEffect.toFixed(2)}  buffet ${Math.hypot(B.buffet.x, B.buffet.y, B.buffet.z).toFixed(2)} m/s2`); }
  L.push(`sim  ${st.ms.toFixed(2)} ms (avg ${st.msAvg.toFixed(2)})  ${st.samples} surface samples  ${st.particles} particles  ${st.pushCells} push cells  ${Mk.total} prints  ${P.events.total} splashes`);
  hud.textContent = L.join('\n');
}
// debug handle for scripted checks: node tools/shot.mjs ... --eval "window.__lab.info()"
window.__lab = {
  physics, ex, sh, frame,
  info() { return { time, here: JSON.parse(JSON.stringify(physics.here)), stats: { ...physics.stats }, explorer: useExplorer ? { speed: ex.phys && ex.phys.speedGround, grounded: ex.grounded, material: ex.phys && ex.phys.material } : null, ship: useShip ? { phase: shPhase, alt: shEnv.altGround, contacts: sh.phys && sh.phys.contacts, asleep: sh.phys && sh.phys.asleep } : null, probes: probes.length, grass: grass ? grass.count : 0, rain: P.rain.count, snow: P.snow.count }; },
  // largest distance (m) between a shader-drawn tip and its CPU twin cannot be read back from the GPU;
  // what can be checked here is that the uniforms the shader gets are the ones the CPU model uses
  uniforms() { return JSON.parse(JSON.stringify(F.uniforms)); },
};
requestAnimationFrame(tick);
</script>
