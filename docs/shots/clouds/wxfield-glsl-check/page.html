<!doctype html><html><body><canvas id="c" width="64" height="64"></canvas>
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { WX, WXFIELD_GLSL, fillAtlases, sampleAtlas } from '/src/world/wxfield.js';
const T = 6*32*32;
const { faceToDir } = await import('/src/physics/windmap.js');
const C = { low: new Float32Array(T), base: new Float32Array(T), top: new Float32Array(T), rain: new Float32Array(T), storm: new Float32Array(T), high: new Float32Array(T) };
const W = { e10: new Float32Array(T), n10: new Float32Array(T) };
const d = [0,0,0];
for (let f=0;f<6;f++) for (let j=0;j<32;j++) for (let i=0;i<32;i++) { const k=(f*32+j)*32+i; faceToDir(f,(i+.5)/16-1,(j+.5)/16-1,d); const [x,y,z]=d;
  C.low[k]=0.5+0.4*Math.sin(2.1*x+1.3*y)*Math.cos(1.7*z); C.base[k]=900+300*Math.sin(1.4*x-0.9*z); C.top[k]=C.base[k]+500+300*Math.cos(y);
  C.rain[k]=Math.max(0,25*Math.sin(1.9*z+0.4*x)); C.storm[k]=0.5+0.5*Math.sin(1.2*y-1.5*z); C.high[k]=0.5+0.5*Math.cos(0.8*x+1.6*y);
  W.e10[k]=6+3*y; W.n10[k]=-4+2*x; }
fillAtlases(C, W, WX.uWxField.value.image.data, WX.uWxField2.value.image.data);
WX.uWxField.value.needsUpdate = WX.uWxField2.value.needsUpdate = true;
// a shadow map: 2x2 texture, matrix maps x,z in [-100,100] to uv
const sh = new THREE.DataTexture(new Uint8Array([0,0,0,255, 255,0,0,255, 128,0,0,255, 64,0,0,255]), 2, 2); sh.needsUpdate = true; sh.minFilter = sh.magFilter = THREE.NearestFilter;
WX.uCloudShadow.value = sh;
WX.uCloudShadowM.value.set(1/200,0,0,0.5, 0,0,1/200,0.5, 0,0,0,0, 0,0,0,1);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c') });
const N = 64;
// each pixel: a direction from its index; rgba out: mode-selected channels (pass 0: field, 1: field2, 2: rain/wind/shadow)
const dirs = []; let s = 12345; const rnd = () => (s = (s*1664525+1013904223)>>>0)/4294967296;
for (let i=0;i<N*N;i++){ const u=rnd()*2-1,a=rnd()*6.283,q=Math.sqrt(1-u*u); dirs.push([q*Math.cos(a),u,q*Math.sin(a)]); }
const dt = new THREE.DataTexture(new Float32Array(dirs.flatMap(v=>[...v,0])), N, N, THREE.RGBAFormat, THREE.FloatType); dt.needsUpdate = true;
const out = [];
for (const mode of [0,1,2,3]) {
  const m = new THREE.ShaderMaterial({ glslVersion: THREE.GLSL3, uniforms: { ...WX, uDirs: { value: dt }, uMode: { value: mode } },
    vertexShader: WXFIELD_GLSL + `uniform sampler2D uDirs; out vec4 vV; void main(){ vV = pcWxField(vec3(0.0,1.0,0.0)); gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: WXFIELD_GLSL + `uniform sampler2D uDirs; uniform int uMode; in vec4 vV; out vec4 oc; void main(){ vec3 d = normalize(texelFetch(uDirs, ivec2(gl_FragCoord.xy), 0).xyz);
      if (uMode == 0) oc = pcWxField(d); else if (uMode == 1) oc = pcWxField2(d);
      else if (uMode == 2) { vec2 w = pcWindAt(d); oc = vec4(pcRainAt(d) / 40.0, w.x / 30.0 * 0.5 + 0.5, w.y / 30.0 * 0.5 + 0.5, pcCloudShadow(vec3(d.x * 99.0, 0.0, d.z * 99.0))); }
      else oc = vV; }` });
  const sc = new THREE.Scene(); sc.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), m));
  r.render(sc, new THREE.Camera());
  const px = new Uint8Array(N*N*4); const gl = r.getContext(); gl.readPixels(0,0,N,N,gl.RGBA,gl.UNSIGNED_BYTE,px); out.push(px);
}
// compare against the CPU twin
const A = WX.uWxField.value.image.data, B = WX.uWxField2.value.image.data, a=[0,0,0,0], b=[0,0,0,0];
let e0=0,e1=0,eR=0,eW=0,eS=0;
for (let i=0;i<N*N;i++){ const [x,y,z]=dirs[i]; sampleAtlas(A,x,y,z,a); sampleAtlas(B,x,y,z,b);
  for (let c=0;c<4;c++){ e0=Math.max(e0,Math.abs(out[0][i*4+c]/255-a[c])); if (c<3) e1=Math.max(e1,Math.abs(out[1][i*4+c]/255-b[c])); }
  eR=Math.max(eR,Math.abs(out[2][i*4]/255*40 - 40*a[2]*a[2]));
  if (Math.abs(y)<0.97) { let ex=z,ez=-x; const l=Math.hypot(ex,ez); ex/=l; ez/=l; const nx=y*ez, ny=z*ex-x*ez, nz=-y*ex; const we=(6+3*y)*1, wn=(-4+2*x);
    // the test map's wind is stored as e10/n10 directly (not a body vector), so pcWindAt returns it
    const ge=(out[2][i*4+1]/255-0.5)*60, gn=(out[2][i*4+2]/255-0.5)*60; eW=Math.max(eW,Math.hypot(ge-we,gn-wn)); }
  const sx=x*99, sz=z*99, u=sx/200+0.5, v=sz/200+0.5; const want=[0,255,128,64][(v>=0.5?2:0)+(u>=0.5?1:0)]/255; eS=Math.max(eS,Math.abs(out[2][i*4+3]/255-want));
}
const vtx = [...out[3].slice(0,4)].map(v=>v/255); sampleAtlas(A,0,1,0,a);
document.title = JSON.stringify({ ok: true, field: e0, field2: e1, rain: eR, wind: eW, shadow: eS, vertex: Math.max(...vtx.map((v,c)=>Math.abs(v-a[c]))) });
</script></body></html>
